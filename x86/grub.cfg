# LoongOS x86_64 GRUB 配置（BIOS + UEFI 双引导由 grub-mkrescue 生成）
# 串口同时作为 GRUB 控制台，便于无显示器环境（NAS / -display none）排障。
serial --unit=0 --speed=115200
terminal_input  console serial
terminal_output console serial

set default=0
set timeout=0

menuentry "LoongOS x86_64 (multiboot2)" {
    multiboot2 /boot/kernel_x86.elf
    boot
}
